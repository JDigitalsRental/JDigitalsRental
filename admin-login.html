<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JDigitalsRental Admin Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #ffffff;
      background:
        radial-gradient(circle at top right, #0b3b91 0, transparent 35%),
        #020817;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 30px 24px;
      background: linear-gradient(145deg, #081a3d, #041027);
      border: 1px solid #173d7c;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 14px;
      box-shadow: 0 0 25px rgba(22, 140, 255, 0.45);
    }

    .brand h1 {
      font-size: 23px;
    }

    .brand h1 span {
      color: #39a9ff;
    }

    .brand p {
      color: #8294b8;
      font-size: 13px;
      margin-top: 7px;
    }

    label {
      display: block;
      color: #91a0bf;
      font-size: 12px;
      font-weight: 700;
      margin: 15px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #173d7c;
      border-radius: 10px;
      background: #06112b;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #168cff;
    }

    .login-button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, #168cff, #0754d9);
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      min-height: 18px;
      margin-top: 15px;
      text-align: center;
      color: #ff8d8d;
      font-size: 12px;
      line-height: 1.5;
    }

    .security-note {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #173d7c;
      color: #7184aa;
      text-align: center;
      font-size: 11px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="login-card">

    <div class="brand">
      <img
        src="assets/jdigitals-logo.png"
        alt="JDigitalsRental Logo"
        class="logo"
      >

      <h1>JDigitals<span>Rental</span></h1>
      <p>Admin Management Login</p>
    </div>

    <form id="loginForm">

      <label for="email">Admin Email</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button
        id="loginButton"
        class="login-button"
        type="submit"
      >
        Login to Dashboard
      </button>

      <div id="message" class="message"></div>

    </form>

    <div class="security-note">
      🔒 Authorized administrator access only
    </div>

  </div>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDYxovJjUSbgiAPLbsNPpcUbrSCISnejqY",
      authDomain: "jdigitalrental.firebaseapp.com",
      projectId: "jdigitalrental",
      storageBucket: "jdigitalrental.firebasestorage.app",
      messagingSenderId: "611741872259",
      appId: "1:611741872259:web:01b3c2bec73d078999ebb6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = "admin.html";
      }
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.textContent = "";
      loginButton.disabled = true;
      loginButton.textContent = "Signing in...";

      try {
        await signInWithEmailAndPassword(
          auth,
          emailInput.value.trim(),
          passwordInput.value
        );

        window.location.href = "admin.html";

      } catch (error) {
        console.error(error);

        message.textContent =
          "Login failed. Please check your email and password.";

        loginButton.disabled = false;
        loginButton.textContent = "Login to Dashboard";
      }
    });
  </script>

</body>
</html>
